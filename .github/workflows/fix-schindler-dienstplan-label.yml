name: Schindler Dienstplan Bezeichnung korrigieren

on:
  push:
    paths:
      - '.github/workflows/fix-schindler-dienstplan-label.yml'

permissions:
  contents: write

jobs:
  fix-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Firmenbezeichnung korrigieren
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dienstplan.html')
          text = p.read_text(encoding='utf-8')
          old = '<p>Intensivpflege-Halle-GmbH</p>'
          new = '<p>Schindler Intensivpflege</p>'
          if old not in text:
              raise SystemExit('Zu ersetzende Bezeichnung nicht gefunden')
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Änderung committen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dienstplan.html
          git diff --cached --quiet && exit 0
          git commit -m 'Schindler im Dienstwunschplan korrekt bezeichnen'
          git push
